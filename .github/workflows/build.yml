name: Generate Windows Executable

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout SMPSPlay code
      uses: actions/checkout@v4

    - name: Download libvgm directly via ZIP
      run: |
        # Téléchargement direct du ZIP pour éviter le bug de l'URL Git
        Invoke-WebRequest -Uri "https://github.com" -OutFile "libvgm.zip"
        
        # Extraction de l'archive
        Expand-Archive -Path "libvgm.zip" -DestinationPath "../"
        
        # Renommer le dossier extrait pour correspondre à la structure attendue
        Rename-Item -Path "../libvgm-master" -NewName "libvgm"
        
        # Création du dossier audio local requis pour le compilateur
        New-Item -ItemType Directory -Force -Path "./audio"
        
        # Copie des fichiers d'en-tête (AudioStream.h, etc.)
        Copy-Item -Path "../libvgm/audio/*" -Destination "./audio/" -Recurse -Force
      shell: pwsh

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Compile Executable
      run: |
        if (Test-Path "*.sln") {
            # Compilation avec inclusion du dossier contenant le sous-dossier audio
            msbuild.exe /p:Configuration=Release /p:PlatformToolset=v143 /p:AdditionalIncludeDirectories="."
        } else {
            pip install pyinstaller
            pyinstaller --onefile *.py
        }

    - name: Upload compiled EXE file
      uses: actions/upload-artifact@v4
      with:
        name: Sonic3-Music-Tool-Windows
        path: |
          **/Release/*.exe
          **/bin/*.exe
          dist/*.exe
