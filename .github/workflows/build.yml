name: Generate Windows Executable

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout SMPSPlay code
      uses: actions/checkout@v4

    - name: Clone missing libvgm dependency
      run: |
        git clone https://github.com ../libvgm
        # Création du dossier audio requis pour l'inclusion des en-têtes
        New-Item -ItemType Directory -Force -Path "./audio"
        # Copie des fichiers audio indispensables à la compilation de Sound.c
        Copy-Item -Path "../libvgm/audio/*" -Destination "./audio/" -Recurse -Force
      shell: pwsh

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Compile Executable
      run: |
        if (Test-Path "*.sln") {
            # Inclusion du dossier courant pour que le compilateur trouve "audio/AudioStream.h"
            msbuild.exe /p:Configuration=Release /p:PlatformToolset=v143 /p:AdditionalIncludeDirectories="."
        } else {
            pip install pyinstaller
            pyinstaller --onefile *.py
        }

    - name: Upload compiled EXE file
      uses: actions/upload-artifact@v4
      with:
        name: Sonic3-Music-Tool-Windows
        path: |
          **/Release/*.exe
          **/bin/*.exe
          dist/*.exe
