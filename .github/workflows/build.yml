name: Generate Windows Executable

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4
      with:
        submodules: recursive # Force GitHub à télécharger les bibliothèques audio externes liées au projet

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Compile Executable
      run: |
        if (Test-Path "*.sln") {
            msbuild.exe /p:Configuration=Release /p:PlatformToolset=v143
        } else {
            pip install pyinstaller
            pyinstaller --onefile *.py
        }

    - name: Upload compiled EXE file
      uses: actions/upload-artifact@v4
      with:
        name: Sonic3-Music-Tool-Windows
        path: |
          **/Release/*.exe
          **/bin/*.exe
          dist/*.exe
