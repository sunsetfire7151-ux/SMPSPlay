name: Generate Windows Executable

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout SMPSPlay code
      uses: actions/checkout@v4

    - name: Download and Extract libvgm
      run: |
        $ProgressPreference = 'SilentlyContinue'
        
        # Téléchargement de l'archive ZIP
        Invoke-WebRequest -Uri "https://github.com" -OutFile "libvgm.zip"
        
        # Extraction robuste en utilisant l'utilitaire natif tar de Windows
        tar -xf libvgm.zip -C ../
        
        # Renommage et organisation des répertoires pour la compilation
        Move-Item -Path "../libvgm-master" -Destination "../libvgm" -Force
        New-Item -ItemType Directory -Force -Path "./audio"
        Copy-Item -Path "../libvgm/audio/*" -Destination "./audio/" -Recurse -Force
      shell: pwsh

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Compile Executable
      run: |
        if (Test-Path "*.sln") {
            msbuild.exe /p:Configuration=Release /p:PlatformToolset=v143 /p:AdditionalIncludeDirectories="."
        } else {
            pip install pyinstaller
            pyinstaller --onefile *.py
        }

    - name: Upload compiled EXE file
      uses: actions/upload-artifact@v4
      with:
        name: Sonic3-Music-Tool-Windows
        path: |
          **/Release/*.exe
          **/bin/*.exe
          dist/*.exe
